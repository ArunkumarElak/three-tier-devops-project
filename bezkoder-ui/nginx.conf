server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container over the Docker network,
    # so the browser only ever talks to this server on port 80.
    location /api/ {
        proxy_pass http://bezkoder-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React single-page app routing
    location / {
        try_files $uri /index.html;
    }
}
